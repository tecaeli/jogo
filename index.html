<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-Office & CRM | Carlos Futebol Clube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Biblioteca para gerar ficheiros Excel (.xlsx). Se estiver offline, o sistema exporta CSV (abre no Excel). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cfcBlue: '#0047AB',
                        cfcDarkBlue: '#002868',
                        cfcLightBlue: '#E6F0FF',
                        cfcAccent: '#00A3FF',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Oswald"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .shake { animation: shake 0.35s; }
        @keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #00A3FF; outline-offset: 2px; }
        .bar-grow { transform-origin: bottom; animation: grow .5s ease-out; }
        @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- ========================================== -->
    <!-- ECRÃ DE AUTENTICAÇÃO DO BACK-OFFICE        -->
    <!-- ========================================== -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-cfcDarkBlue via-cfcBlue to-slate-900">
        <div id="auth-card" class="bg-white rounded-2xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border-t-8 border-cfcAccent fade-in">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-12 h-12 bg-cfcBlue text-white rounded-full flex items-center justify-center font-display font-bold text-lg">CFC</div>
                    <div>
                        <h1 class="font-display text-2xl font-bold text-cfcDarkBlue uppercase">Back-Office</h1>
                        <p class="text-xs text-slate-500">Carlos Futebol Clube • Gestão & Permissões</p>
                    </div>
                </div>
                <a id="public-site-link-login" href="#" class="hidden text-xs font-bold text-cfcBlue hover:underline"><i class="fas fa-arrow-left mr-1"></i> Site</a>
            </div>

            <div id="auth-msg" class="hidden"></div>

            <form onsubmit="handleBackofficeLogin(event)" class="space-y-4">
                <div>
                    <label for="bo-login-user" class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail de acesso</label>
                    <input type="text" id="bo-login-user" autocomplete="username" required class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-cfcBlue">
                </div>
                <div>
                    <label for="bo-login-pass" class="block text-xs font-bold text-slate-700 uppercase mb-1">Palavra-passe</label>
                    <div class="relative">
                        <input type="password" id="bo-login-pass" autocomplete="current-password" required class="w-full border border-slate-300 rounded-lg pl-3.5 pr-11 py-2.5 text-sm focus:outline-none focus:border-cfcBlue">
                        <button type="button" onclick="togglePass()" aria-label="Mostrar ou esconder a palavra-passe" class="absolute right-0 top-0 h-full px-3 text-slate-400 hover:text-cfcBlue"><i id="pass-eye" class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-cfcBlue hover:bg-cfcDarkBlue text-white font-bold py-3 rounded-xl text-xs uppercase tracking-wider shadow-lg transition">
                    <i class="fas fa-lock-open mr-2"></i> Entrar no Painel
                </button>
            </form>

            <div id="demo-box" class="hidden mt-6 pt-5 border-t border-slate-100">
                <p class="text-[11px] font-bold text-slate-400 uppercase mb-2.5">Modo demonstração • Acesso rápido por perfil:</p>
                <div id="quick-login-users" class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs"></div>
                <p class="text-[10px] text-slate-400 mt-3">Os dados ficam guardados apenas neste navegador.</p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PAINEL ADMINISTRATIVO (APÓS LOGIN)         -->
    <!-- ========================================== -->
    <div id="dashboard-screen" class="hidden h-screen overflow-hidden">
        <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden" onclick="setMenu(false)"></div>

        <!-- MENU LATERAL: entra e sai com o botão das três barras -->
        <aside id="sidebar" aria-label="Menu principal" class="fixed md:static inset-y-0 left-0 z-40 w-72 -translate-x-full md:translate-x-0 transition-all duration-300 bg-cfcDarkBlue text-white h-full shadow-xl flex-shrink-0 overflow-hidden">
            <div class="w-72 h-full flex flex-col">
                <div class="p-5 border-b border-blue-900">
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-cfcAccent">Back-Office Oficial</span>
                            <h2 class="font-display text-xl font-bold uppercase mt-0.5">Carlos Futebol Clube</h2>
                        </div>
                        <button onclick="setMenu(false, true)" aria-label="Fechar o menu" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center"><i class="fas fa-times"></i></button>
                    </div>
                    <div id="logged-user-card" class="mt-4 bg-blue-950/70 p-3 rounded-xl border border-blue-800 text-xs flex items-center gap-3"></div>
                </div>

                <nav id="bo-nav-menu" class="flex-1 p-3 space-y-1 overflow-y-auto text-xs font-semibold"></nav>

                <div class="p-4 border-t border-blue-900 space-y-2">
                    <a id="public-site-link-nav" href="#" target="_blank" class="hidden w-full bg-cfcBlue hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center transition">
                        <i class="fas fa-external-link-alt mr-2"></i> Ver Site Público
                    </a>
                    <button onclick="logoutBackoffice()" class="w-full bg-white/10 hover:bg-red-600 text-white font-bold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center transition">
                        <i class="fas fa-sign-out-alt mr-2"></i> Terminar Sessão
                    </button>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden min-w-0">
            <!-- BARRA SUPERIOR -->
            <header class="bg-white border-b border-slate-200 flex items-center gap-2 sm:gap-3 px-3 md:px-6 py-2.5 shadow-sm flex-shrink-0">
                <button id="burger" onclick="toggleSidebar()" aria-label="Abrir ou fechar o menu" aria-expanded="false" class="w-11 h-11 rounded-xl bg-cfcBlue text-white flex items-center justify-center hover:bg-cfcDarkBlue transition shadow flex-shrink-0 text-lg">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="min-w-0 flex-1">
                    <p id="topbar-title" class="font-display uppercase text-cfcDarkBlue text-base md:text-lg truncate leading-tight">Back-Office</p>
                    <p id="topbar-date" class="hidden sm:block text-[11px] text-slate-400 capitalize"></p>
                </div>
                <button onclick="openPalette()" aria-label="Pesquisar" title="Pesquisar (Ctrl+K)" class="h-10 px-3 rounded-xl bg-slate-100 hover:bg-cfcLightBlue text-slate-600 flex items-center gap-2 text-xs font-semibold transition">
                    <i class="fas fa-search"></i><span class="hidden md:inline">Pesquisar</span><kbd class="hidden lg:inline text-[10px] bg-white border rounded px-1.5 py-0.5 text-slate-400">Ctrl K</kbd>
                </button>
                <button onclick="showHelp()" aria-label="Ajuda desta página" title="Ajuda desta página" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-cfcLightBlue text-slate-600 flex items-center justify-center transition"><i class="fas fa-question"></i></button>
                <button onclick="openAlerts()" aria-label="Avisos" title="Avisos" class="relative w-10 h-10 rounded-xl bg-slate-100 hover:bg-cfcLightBlue text-slate-600 flex items-center justify-center transition">
                    <i class="fas fa-bell"></i>
                    <span id="bell-badge" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
                </button>
            </header>

            <main id="main-scroll" class="flex-1 overflow-y-auto p-4 md:p-8">
                <div id="bo-content" class="max-w-6xl mx-auto space-y-6"></div>
            </main>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="palette-root"></div>
    <div id="bo-toast" class="hidden"></div>

    <script>
        // ======================================================================
        // CONFIGURAÇÃO
        // ======================================================================
        const DEMO_MODE = true;          // true = mostra logins de teste. Colocar false em produção.
        const PUBLIC_SITE_URL = '';      // ex.: 'site.html' — endereço do site público (vazio = esconde os links)
        const IDLE_MS = 30 * 60 * 1000;  // termina a sessão após 30 min sem atividade

        const STORAGE_KEY = 'cfc_portal_data_v2';        // partilhado com o site público
        const USERS_KEY = 'cfc_backoffice_users_v2';
        const AUDIT_KEY = 'cfc_backoffice_audit_v2';
        const SESSION_KEY = 'cfc_backoffice_session_v1';
        const TAB_KEY = 'cfc_backoffice_tab_v1';
        const MENU_PREF_KEY = 'cfc_backoffice_menu_v1';
        const MIGR_KEY = 'cfc_bo_migr_loja_v1';

        const ALL_PERMISSIONS = [
            { id: 'dashboard', label: 'Visão Geral & KPIs', icon: 'fa-chart-line' },
            { id: 'socios', label: 'Área de Sócios & CRM', icon: 'fa-id-card' },
            { id: 'loja', label: 'Loja & Vendas (PDV)', icon: 'fa-shopping-bag' },
            { id: 'financas', label: 'Finanças & Receitas', icon: 'fa-coins' },
            { id: 'gestao', label: 'Gestão Operacional & Notícias', icon: 'fa-cogs' },
            { id: 'bilheteria', label: 'Bilheteria & Lotação', icon: 'fa-ticket-alt' },
            { id: 'multimedia', label: 'Multimédia (Fotos/Vídeos/Carrosséis)', icon: 'fa-photo-video' },
            { id: 'patrocinadores', label: 'Patrocinadores & Logos', icon: 'fa-handshake' },
            { id: 'contactos', label: 'Caixa de Contactos (Dept.)', icon: 'fa-envelope-open-text' },
            { id: 'usuarios', label: 'Administração de Utilizadores', icon: 'fa-users-cog' },
            { id: 'definicoes', label: 'Definições & Cópia de Segurança', icon: 'fa-shield-alt' }
        ];
        const ADMIN_ONLY = ['usuarios', 'definicoes'];

        const SOCIO_CATEGORIAS = ['Sócio Efetivo', 'Sócio VIP Teca', 'Sócio Correspondente'];
        const DEFAULT_DISCOUNTS = { 'Sócio Efetivo': 10, 'Sócio VIP Teca': 20, 'Sócio Correspondente': 5 };
        const PAGAMENTOS = ['Numerário', 'TPA / Multicaixa', 'Transferência', 'Express'];

        const DEFAULT_CATALOG = [
            { id: 'bil-geral',   nome: 'Bilhete – Bancada Geral',   cat: 'Bilhetes',  preco: 3000,  bancada: 'geral' },
            { id: 'bil-central', nome: 'Bilhete – Bancada Central', cat: 'Bilhetes',  preco: 8000,  bancada: 'central' },
            { id: 'bil-vip',     nome: 'Bilhete – Camarote VIP',    cat: 'Bilhetes',  preco: 25000, bancada: 'vip' },
            { id: 'cam-1',       nome: 'Camisola Oficial 2026/27',  cat: 'Camisolas', preco: 18000, stock: 120 },
            { id: 'cam-2',       nome: 'Camisola Alternativa',      cat: 'Camisolas', preco: 16000, stock: 80 },
            { id: 'cas-1',       nome: 'Casaco Oficial',            cat: 'Casacos',   preco: 35000, stock: 40 },
            { id: 'bon-1',       nome: 'Boné CFC',                  cat: 'Bonés',     preco: 6000,  stock: 150 }
        ];
        const DEFAULT_STANDS = {
            geral:   { nome: 'Bancada Geral',   cap: 30000, vendidos: 24500 },
            central: { nome: 'Bancada Central', cap: 12000, vendidos: 6200 },
            vip:     { nome: 'Camarotes VIP',   cap: 1000,  vendidos: 750 }
        };

        const defaultUsers = [
            { id: 'usr-1', nome: 'Dr. Carlos Mendes (Admin)', email: 'admin@carlosfc.ao', senha: 'admin123', cargo: 'Administrador Geral', isAdmin: true, ativo: true, permissoes: ALL_PERMISSIONS.map(p => p.id) },
            { id: 'usr-2', nome: 'Helena Costa', email: 'socios@carlosfc.ao', senha: '123', cargo: 'Gestora de Sócios', isAdmin: false, ativo: true, permissoes: ['socios'] },
            { id: 'usr-3', nome: 'Manuel Tavares', email: 'financas@carlosfc.ao', senha: '123', cargo: 'Diretor Financeiro', isAdmin: false, ativo: true, permissoes: ['financas'] },
            { id: 'usr-4', nome: 'Sofia Mateus', email: 'bilheteria@carlosfc.ao', senha: '123', cargo: 'Responsável Bilheteria', isAdmin: false, ativo: true, permissoes: ['bilheteria'] },
            { id: 'usr-5', nome: 'Rui Paulo', email: 'loja@carlosfc.ao', senha: '123', cargo: 'Operador de Loja', isAdmin: false, ativo: true, permissoes: ['loja'] }
        ];

        // Ajuda em linguagem simples, mostrada no topo de cada área
        const HELP = {
            dashboard: { t: 'a Visão Geral', s: ['Aqui vê o resumo do clube de relance.', 'Os avisos a laranja mostram o que precisa da sua atenção. Toque num para resolver.', 'Use os atalhos para ir direto às tarefas mais comuns.'] },
            socios: { t: 'os Sócios', s: ['Para registar um sócio, preencha o quadro "Adicionar Novo Sócio".', 'Quem tem quotas pendentes aparece a vermelho. Toque em "Cobrar" para enviar um lembrete por WhatsApp.', 'Os descontos da loja definem-se no quadro "Descontos de Sócio na Loja".'] },
            loja: { t: 'a Loja', s: ['1. Escolha se o cliente é Sócio ou Não sócio.', '2. Toque nos artigos para os pôr no carrinho.', '3. Escolha o pagamento e toque em "Finalizar Venda". O desconto de sócio é automático e Finanças recebe a venda sozinha.'] },
            financas: { t: 'as Finanças', s: ['Escolha as datas (ou toque em Hoje, Esta semana, Este mês).', 'Veja os totais separados por sócios e não sócios.', 'Toque em "Exportar Excel" para obter o ficheiro para a contabilidade.'] },
            gestao: { t: 'as Notícias', s: ['Escreva o título, escolha a categoria e toque em "Publicar no Site".', 'A notícia aparece logo no site público.', 'Para apagar, use "Remover" ao lado da notícia.'] },
            bilheteria: { t: 'a Bilheteria', s: ['Veja quantos bilhetes já foram vendidos em cada bancada.', 'Os bilhetes vendidos na Loja descontam das vagas automaticamente.', 'Mude o nome do jogo e as lotações no quadro de baixo.'] },
            multimedia: { t: 'a Multimédia', s: ['Escolha: foto, carrossel (várias fotos) ou vídeo.', 'Cole o endereço (URL) da imagem. Para carrossel, separe vários endereços com vírgula.', 'Toque em "Publicar na Galeria Multimédia".'] },
            patrocinadores: { t: 'os Patrocinadores', s: ['Escreva o nome da empresa, o nível e o setor.', 'O logótipo é opcional: cole o endereço ou o caminho da imagem.', 'Toque em "Adicionar".'] },
            contactos: { t: 'os Contactos', s: ['Aqui chegam as mensagens enviadas pelo site.', 'Depois de responder ao cliente, toque em "Marcar como Respondida".', 'Use o filtro para ver só as que faltam responder.'] },
            usuarios: { t: 'os Utilizadores', s: ['Crie contas para a sua equipa e escolha só as áreas que cada pessoa pode ver.', 'Para mudar o acesso, toque nos botões azuis por baixo do nome.', 'Pode desativar uma conta sem a apagar.'] },
            definicoes: { t: 'as Definições', s: ['Faça uma cópia de segurança com regularidade e guarde o ficheiro num local seguro.', 'Para recuperar dados, use "Restaurar cópia".', 'O registo de auditoria mostra quem fez o quê.'] }
        };

        const TOUR = [
            { icon: 'fa-bars', title: 'O menu', text: 'Toque nas três barras, no canto superior esquerdo, para abrir ou esconder o menu com todas as áreas.' },
            { icon: 'fa-search', title: 'Procurar tudo', text: 'Use a lupa (ou Ctrl+K no computador) para encontrar um sócio, uma venda ou ir direto a qualquer área.' },
            { icon: 'fa-bell', title: 'Avisos inteligentes', text: 'O sino mostra o que precisa da sua atenção, como quotas em atraso, mensagens por responder ou stock a acabar.' },
            { icon: 'fa-question', title: 'Ajuda em cada página', text: 'Cada área tem uma caixa "Como usar". Toque no ponto de interrogação para a ver outra vez.' }
        ];

        // ======================================================================
        // UTILITÁRIOS
        // ======================================================================
        const $ = id => document.getElementById(id);
        const clone = o => JSON.parse(JSON.stringify(o));
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const kz = n => (Number(n) || 0).toLocaleString('pt-PT') + ' Kz';
        const kzShort = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
        const pad = (n, l = 2) => String(n).padStart(l, '0');
        const isDesktop = () => window.matchMedia ? window.matchMedia('(min-width: 768px)').matches : window.innerWidth >= 768;
        function isoOf(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
        function todayISO() { return isoOf(new Date()); }
        function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
        function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
        function downloadBlob(filename, blob) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
        }

        // ======================================================================
        // DADOS
        // ======================================================================
        function loadUsers() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(USERS_KEY)); } catch (e) {}
            if (!Array.isArray(saved) || !saved.length) {
                saved = clone(defaultUsers);
            } else if (!localStorage.getItem(MIGR_KEY)) {
                if (!saved.some(u => u.id === 'usr-5')) saved.push(clone(defaultUsers.find(u => u.id === 'usr-5')));
            }
            localStorage.setItem(MIGR_KEY, '1');
            localStorage.setItem(USERS_KEY, JSON.stringify(saved));
            return saved;
        }
        function saveUsers() { localStorage.setItem(USERS_KEY, JSON.stringify(usersList)); }

        function loadClubData() {
            let d = {};
            try { d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (e) { d = {}; }
            const base = {
                noticias: [], multimedia: [], patrocinadores: [], mensagensContacto: [],
                sociosCRM: [
                    { id: 'CFC-001', nome: 'António Manuel', categoria: 'Sócio Efetivo', quotas: 'Em dia', telemovel: '+244 923 111 222' },
                    { id: 'CFC-002', nome: 'Maria Fernanda', categoria: 'Sócio VIP Teca', quotas: 'Em dia', telemovel: '+244 924 333 444' }
                ],
                vendas: [],
                catalogo: clone(DEFAULT_CATALOG),
                bancadas: clone(DEFAULT_STANDS),
                descontos: clone(DEFAULT_DISCOUNTS),
                config: {}
            };
            Object.keys(base).forEach(k => { if (d[k] === undefined || d[k] === null) d[k] = base[k]; });
            d.config = Object.assign({ bloquearDescontoQuotasPendentes: true, proximoJogo: 'CFC – próximo jogo em casa' }, d.config);
            return d;
        }
        function saveClubData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(clubData)); }
        // Recarrega os dados mais recentes (o site público também escreve aqui), aplica a alteração e grava
        function mutate(fn) {
            clubData = loadClubData();
            const r = fn(clubData);
            saveClubData();
            refreshChrome();
            return r;
        }

        function logAudit(acao) {
            let logs = [];
            try { logs = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]'); } catch (e) {}
            logs.unshift({ data: new Date().toLocaleString('pt-PT'), usuario: currentUser ? currentUser.nome : 'Sistema', acao });
            localStorage.setItem(AUDIT_KEY, JSON.stringify(logs.slice(0, 200)));
        }

        let usersList = loadUsers();
        let clubData = loadClubData();
        let currentUser = null;
        let activeTab = '';
        let forceHelp = false;

        const can = perm => !!currentUser && (currentUser.isAdmin || (!ADMIN_ONLY.includes(perm) && currentUser.permissoes.includes(perm)));

        // ======================================================================
        // AVISOS (toasts), JANELAS (modais), MENU
        // ======================================================================
        function showBoToast(msg, type) {
            type = type || (/(inválid|sem disponib|selecione|já existe|não há|não pode|indique|demasiado|adicione|erro|entre 0|negado|sem permiss|bloque|incorret|escreva)/i.test(msg) ? 'warn' : 'ok');
            const t = $('bo-toast');
            const warn = type === 'warn';
            t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 bg-cfcDarkBlue text-white px-5 py-3 rounded-xl shadow-2xl border-l-4 z-[80] text-xs font-bold max-w-sm w-[calc(100%-2rem)] md:w-auto flex items-center gap-2 ' + (warn ? 'border-amber-400' : 'border-cfcAccent');
            t.innerHTML = `<i class="fas ${warn ? 'fa-exclamation-triangle text-amber-300' : 'fa-check-circle text-cfcAccent'}"></i><span>${esc(msg)}</span>`;
            clearTimeout(window._boToast);
            window._boToast = setTimeout(() => t.classList.add('hidden'), 3800);
        }

        // --- Menu retrátil (três barras) ---
        let menuOpen = false;
        function setMenu(open, persist) {
            menuOpen = !!open;
            const sb = $('sidebar'), ov = $('sidebar-overlay'), bg = $('burger');
            if (isDesktop()) {
                sb.classList.remove('-translate-x-full');
                sb.style.width = menuOpen ? '18rem' : '0px';
                ov.classList.add('hidden');
                if (persist) { try { localStorage.setItem(MENU_PREF_KEY, menuOpen ? '1' : '0'); } catch (e) {} }
            } else {
                sb.style.width = '';
                sb.classList.toggle('-translate-x-full', !menuOpen);

        // ======================================================================
        // LÓGICA DE VENDAS
        // ======================================================================
        function disponivel(d, p) {
            if (p.bancada) { const b = d.bancadas[p.bancada]; return b ? Math.max(0, b.cap - b.vendidos) : 0; }
            return Math.max(0, Number(p.stock) || 0);
        }

        function priceCart(d, tipo, socioId, cart) {
            const socio = tipo === 'socio' ? d.sociosCRM.find(s => s.id === socioId) : null;
            let pct = 0, motivo = '';
            if (socio) {
                if (d.config.bloquearDescontoQuotasPendentes && socio.quotas !== 'Em dia') motivo = 'Quotas pendentes';
                else pct = Number(d.descontos[socio.categoria]) || 0;
            }
            const erros = [], lines = [];
            cart.forEach(c => {
                const prod = d.catalogo.find(p => p.id === c.id);
                if (!prod) return;
                const disp = disponivel(d, prod);
                if (c.qtd > disp) erros.push(`Sem disponibilidade de "${prod.nome}" (restam ${disp}).`);
                const bruto = prod.preco * c.qtd;
                const desc = Math.round(bruto * pct / 100);
                lines.push({ prod, qtd: c.qtd, bruto, desc, total: bruto - desc });
            });
            const bruto = lines.reduce((s, l) => s + l.bruto, 0);
            const desconto = lines.reduce((s, l) => s + l.desc, 0);
            return { socio, pct, motivo, lines, erros, bruto, desconto, total: bruto - desconto };
        }

        function applySale(d, meta) {
            const pr = priceCart(d, meta.tipo, meta.socioId, meta.cart);
            if (!pr.lines.length) throw new Error('Adicione pelo menos um artigo.');
            if (meta.tipo === 'socio' && !pr.socio) throw new Error('Selecione um sócio válido.');
            if (pr.erros.length) throw new Error(pr.erros[0]);
            pr.lines.forEach(l => {
                if (l.prod.bancada) d.bancadas[l.prod.bancada].vendidos += l.qtd;
                else d.catalogo.find(x => x.id === l.prod.id).stock -= l.qtd;
            });
            const n = d.vendas.reduce((m, v) => Math.max(m, parseInt(String(v.id).replace(/\D/g, ''), 10) || 0), 0) + 1;
            const sale = {
                id: 'VND-' + pad(n, 5),
                data: todayISO(), hora: nowHM(),
                tipoCliente: meta.tipo === 'socio' ? 'Sócio' : 'Não sócio',
                socioId: pr.socio ? pr.socio.id : '',
                cliente: pr.socio ? pr.socio.nome : (meta.nome || 'Cliente de balcão'),
                telefone: pr.socio ? pr.socio.telemovel : (meta.tel || ''),
                categoriaSocio: pr.socio ? pr.socio.categoria : '',
                quotasSocio: pr.socio ? pr.socio.quotas : '',
                descontoPct: pr.pct,
                motivoSemDesconto: pr.motivo,
                itens: pr.lines.map(l => ({
                    produtoId: l.prod.id, produto: l.prod.nome, categoria: l.prod.cat, qtd: l.qtd,
                    precoUnit: l.prod.preco, descontoPct: pr.pct, bruto: l.bruto, desconto: l.desc, total: l.total,
                    jogo: l.prod.bancada ? d.config.proximoJogo : ''
                })),
                bruto: pr.bruto, desconto: pr.desconto, total: pr.total,
                pagamento: meta.pag, vendedor: currentUser ? currentUser.nome : '',
                estado: 'Concluída', origem: 'Back-office'
            };
            d.vendas.unshift(sale);
            return sale;
        }

        function tipoLabel(v) {
            if (v.tipoCliente === 'Sócio') return v.descontoPct > 0 ? 'Sócio (com desconto)' : 'Sócio (sem desconto' + (v.motivoSemDesconto ? ' – ' + v.motivoSemDesconto.toLowerCase() : '') + ')';

            if (v.tipoCliente === 'Sócio') {

                    ? `<span class="px-2 py-0.5 rounded font-bold bg-green-100 text-green-700 whitespace-nowrap">Sócio · -${v.descontoPct}%</span>`
                    : `<span class="px-2 py-0.5 rounded font-bold bg-amber-100 text-amber-700 whitespace-nowrap">Sócio · sem desconto</span>`;
            }
            return `<span class="px-2 py-0.5 rounded font-bold bg-slate-200 text-slate-700 whitespace-nowrap">Não sócio</span>`;

        function exportVendas(vendas, filename, periodo) {

            const rowsOf = list => {
                const rows = [];

                    v.id, fmtDate(v.data), v.hora, tipoLabel(v), v.socioId || '—', v.cliente, v.categoriaSocio || '—',
                    it.produto, it.categoria, it.qtd, it.precoUnit, it.descontoPct, it.bruto, it.desconto, it.total,
                    v.pagamento, v.vendedor, v.origem || 'Back-office'
                ])));
                return rows;
            };
            const detalhe = rowsOf(ok);
            const n = detalhe.length;
            const sum = col => detalhe.reduce((s, r) => s + (Number(r[col]) || 0), 0);
            const detalheAoa = [HEAD, ...detalhe, ['TOTAL', '', '', '', '', '', '', '', '', sum(9), '', '', sum(12), sum(13), sum(14), '', '', '']];
            const widths = [11, 11, 7, 34, 10, 24, 20, 30, 16, 6, 14, 12, 16, 14, 16, 18, 22, 12];

            const grp = (list, keyFn) => { const m = {}; list.forEach(v => { const k = keyFn(v); m[k] = m[k] || { n: 0, bruto: 0, desc: 0, tot: 0 }; m[k].n++; m[k].bruto += v.bruto; m[k].desc += v.desconto; m[k].tot += v.total; }); return m; };
            const porTipo = grp(ok, tipoLabel);
            const porPag = grp(ok, v => v.pagamento);
            const porCat = {};
            ok.forEach(v => v.itens.forEach(it => { const c = porCat[it.categoria] = porCat[it.categoria] || { qtd: 0, bruto: 0, desc: 0, tot: 0 }; c.qtd += it.qtd; c.bruto += it.bruto; c.desc += it.desconto; c.tot += it.total; }));
            const tot = { n: ok.length, bruto: ok.reduce((s, v) => s + v.bruto, 0), desc: ok.reduce((s, v) => s + v.desconto, 0), tot: ok.reduce((s, v) => s + v.total, 0) };
            const resumo = [
                ['Carlos Futebol Clube – Relatório de Vendas da Loja'],

        function findVenda(id) { return clubData.vendas.find(v => v.id === id); }

        async function anularVenda(id) {
            if (!(can('loja') || can('financas'))) return showBoToast('Sem permissão para anular vendas.');
            const motivo = await uiPrompt(`Anular venda ${id}`, 'Escreva o motivo da anulação. O stock e as vagas serão repostos.', { placeholder: 'Ex.: cliente desistiu', okText: 'Anular venda' });
            if (motivo === null) return;
            if (!motivo.trim()) return showBoToast('Indique o motivo da anulação.');
            mutate(d => {
                const v = d.vendas.find(x => x.id === id);
                if (!v || v.estado === 'Anulada') return;
                v.itens.forEach(it => {
                    const p = d.catalogo.find(x => x.id === it.produtoId);
                    if (!p) return;
                    if (p.bancada && d.bancadas[p.bancada]) d.bancadas[p.bancada].vendidos = Math.max(0, d.bancadas[p.bancada].vendidos - it.qtd);
                    else if (p.stock != null) p.stock += it.qtd;
                });
                v.estado = 'Anulada'; v.motivoAnulacao = motivo.trim(); v.anuladaPor = currentUser.nome;
            });
            logAudit(`Anulou a venda ${id} (${motivo.trim()})`);
            showBoToast(`Venda ${id} anulada e stock reposto.`);
            selectBoTab(activeTab);
        }

        }

        // ======================================================================
        // 2. ÁREA DE SÓCIOS & CRM
        // ======================================================================
        let soc = { q: '', cat: '', quota: '' };

        function socioStats(id) {
            const vs = (clubData.vendas || []).filter(v => v.socioId === id && v.estado !== 'Anulada');
            return { n: vs.length, total: vs.reduce((s, v) => s + v.total, 0), desc: vs.reduce((s, v) => s + v.desconto, 0) };
        }

        function waLink(s) {
            let dg = (s.telemovel || '').replace(/\D/g, '');
            if (dg.length === 9) dg = '244' + dg;
            const msg = `Olá ${firstName(s.nome)}, aqui é o Carlos Futebol Clube. Verificámos que as suas quotas de sócio (${s.id}) estão pendentes. Pode regularizar quando lhe for conveniente? Obrigado pelo seu apoio!`;
            return `https://wa.me/${dg}?text=${encodeURIComponent(msg)}`;
        }

        function renderBoSocios(box) {
            soc = { q: '', cat: '', quota: '' };
            const tot = clubData.sociosCRM.length, pend = clubData.sociosCRM.filter(s => s.quotas !== 'Em dia').length;
            box.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-cfcBlue flex flex-wrap justify-between items-center gap-4">
                        <div>
                            <h2 class="font-display text-2xl font-bold text-cfcDarkBlue uppercase">Gestão de Sócios & Quotas</h2>
                            <p class="text-xs text-slate-500">Administração de associados, cobrança de quotas e descontos de loja.</p>
                        </div>
                        <button onclick="exportSocios()" class="bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg px-4 py-2.5 text-xs"><i class="fas fa-file-excel mr-1"></i> Exportar Sócios (Excel)</button>
                    </div>

                    <div class="grid grid-cols-3 gap-3 text-center text-xs">
                        <button onclick="socQuick('')" class="bg-white p-3 rounded-xl shadow hover:shadow-md transition"><span class="block font-display text-2xl text-cfcDarkBlue">${tot}</span>Todos</button>
                        <button onclick="socQuick('Em dia')" class="bg-white p-3 rounded-xl shadow hover:shadow-md transition"><span class="block font-display text-2xl text-green-600">${tot - pend}</span>Em dia</button>
                        <button onclick="socQuick('Pendente')" class="bg-white p-3 rounded-xl shadow hover:shadow-md transition"><span class="block font-display text-2xl text-red-600">${pend}</span>Pendentes</button>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow space-y-4">
                        <div>
                            <h3 class="font-bold text-sm uppercase text-cfcDarkBlue"><i class="fas fa-percent text-cfcBlue mr-1"></i> Descontos de Sócio na Loja</h3>
                            <p class="text-[11px] text-slate-500">Aplicados automaticamente em bilhetes, camisolas, casacos e bonés quando a compra é feita por um sócio.</p>
                        </div>
                        <form onsubmit="saveDescontos(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                            ${SOCIO_CATEGORIAS.map((c, i) => `
                                <label class="block"><span class="font-bold text-slate-600">${esc(c)} (%)</span>
                                    <input type="number" min="0" max="100" step="1" id="desc-${i}" value="${Number(clubData.descontos[c]) || 0}" class="mt-1 w-full border rounded-lg px-3 py-2">
                                </label>`).join('')}
                            <label class="sm:col-span-3 flex items-center space-x-2 bg-slate-50 border rounded-lg p-3">
                                <input type="checkbox" id="desc-bloq" ${clubData.config.bloquearDescontoQuotasPendentes ? 'checked' : ''}>
                                <span class="font-semibold text-slate-700">Sócios com quotas pendentes <u>não</u> têm desconto</span>
                            </label>
                            <div class="sm:col-span-3"><button type="submit" class="bg-cfcBlue hover:bg-cfcDarkBlue text-white font-bold rounded-lg px-4 py-2.5">Guardar Descontos</button></div>
                        </form>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow space-y-4">
                        <h3 class="font-bold text-sm uppercase text-cfcDarkBlue">Adicionar Novo Sócio</h3>
                        <form onsubmit="addSocio(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <input type="text" id="soc-nome" required placeholder="Nome completo" class="border rounded-lg px-3 py-2.5 text-xs">
                            <select id="soc-cat" class="border rounded-lg px-3 py-2.5 text-xs">${SOCIO_CATEGORIAS.map(c => `<option>${esc(c)}</option>`).join('')}</select>
                            <input type="tel" id="soc-tel" required placeholder="Telemóvel (+244...)" class="border rounded-lg px-3 py-2.5 text-xs">
                            <button type="submit" class="bg-cfcBlue text-white font-bold rounded-lg px-4 py-2.5 text-xs hover:bg-cfcDarkBlue">Registar Sócio</button>
                        </form>
                    </div>

                    <div class="bg-white p-4 rounded-2xl shadow grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <input type="search" id="soc-f-q" oninput="socFilter()" placeholder="Pesquisar por nome, nº ou telemóvel..." class="border rounded-lg px-3 py-2.5">
                        <select id="soc-f-cat" onchange="socFilter()" class="border rounded-lg px-3 py-2.5"><option value="">Todas as categorias</option>${SOCIO_CATEGORIAS.map(c => `<option>${esc(c)}</option>`).join('')}</select>
                        <select id="soc-f-quota" onchange="socFilter()" class="border rounded-lg px-3 py-2.5"><option value="">Todas as quotas</option><option>Em dia</option><option>Pendente</option></select>
                    </div>

                    <div id="soc-table" class="bg-white rounded-2xl shadow overflow-x-auto"></div>
                    <div id="socio-hist"></div>
                </div>
            `;
            socRenderTable();
        }

        function socQuick(q) { $('soc-f-quota').value = q; socFilter(); }
        function socFilter() {
            soc.q = $('soc-f-q').value.trim().toLowerCase();
            soc.cat = $('soc-f-cat').value;
            soc.quota = $('soc-f-quota').value;
            socRenderTable();
        }

        function socRenderTable() {
            const list = (clubData.sociosCRM || []).filter(s =>
                (!soc.q || (s.nome + ' ' + s.id + ' ' + s.telemovel).toLowerCase().includes(soc.q)) &&
                (!soc.cat || s.categoria === soc.cat) && (!soc.quota || s.quotas === soc.quota));
            $('soc-table').innerHTML = `
                <table class="w-full text-left text-xs">
                    <thead class="bg-cfcDarkBlue text-white uppercase">
                        <tr><th class="p-3.5">Nº Sócio</th><th class="p-3.5">Nome</th><th class="p-3.5">Categoria</th><th class="p-3.5">Desconto</th><th class="p-3.5">Telemóvel</th><th class="p-3.5">Quotas</th><th class="p-3.5">Compras na Loja</th><th class="p-3.5">Ação</th></tr>
                    </thead>
                    <tbody class="divide-y">
                        ${list.map(s => {
                            const st = socioStats(s.id);
                            const pct = Number(clubData.descontos[s.categoria]) || 0;
                            const aplica = !(clubData.config.bloquearDescontoQuotasPendentes && s.quotas !== 'Em dia');
                            return `
                            <tr>
                                <td class="p-3.5 font-bold text-cfcBlue">${esc(s.id)}</td>
                                <td class="p-3.5 font-semibold">${esc(s.nome)}</td>
                                <td class="p-3.5"><select onchange="changeSocioCat('${esc(s.id)}', this.value)" class="border rounded px-1.5 py-1">${SOCIO_CATEGORIAS.map(c => `<option ${c === s.categoria ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></td>
                                <td class="p-3.5">${aplica ? `<span class="font-bold text-green-700">${pct}%</span>` : '<span class="font-bold text-amber-700">0% (quotas)</span>'}</td>
                                <td class="p-3.5">${esc(s.telemovel)}</td>
                                <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold ${s.quotas === 'Em dia' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${esc(s.quotas)}</span></td>
                                <td class="p-3.5"><button onclick="verComprasSocio('${esc(s.id)}')" class="text-cfcBlue font-bold hover:underline">${st.n} compra(s) • ${kz(st.total)}</button></td>
                                <td class="p-3.5 whitespace-nowrap">
                                    ${s.quotas !== 'Em dia' ? `<a href="${waLink(s)}" target="_blank" rel="noopener" class="text-green-600 font-bold hover:underline mr-2"><i class="fab fa-whatsapp"></i> Cobrar</a>` : ''}
                                    <button onclick="toggleQuota('${esc(s.id)}')" class="text-cfcBlue font-bold hover:underline mr-2">Alternar Quotas</button>
                                    <button onclick="removeSocio('${esc(s.id)}')" class="text-red-600 font-bold hover:underline">Remover</button>
                                </td>
                            </tr>`;
                        }).join('') || '<tr><td colspan="8" class="p-8 text-center text-slate-400"><i class="fas fa-users text-2xl block mb-2"></i>Nenhum sócio encontrado.</td></tr>'}
                    </tbody>
                </table>`;
        }

        function addSocio(e) {
            e.preventDefault();
            const nome = $('soc-nome').value.trim();
            const categoria = $('soc-cat').value;
            const telemovel = $('soc-tel').value.trim();
            if (!/^\+?[\d\s]{9,16}$/.test(telemovel)) return showBoToast('Telemóvel inválido (ex.: +244 923 000 000).');
            const dig = telemovel.replace(/\D/g, '');
            if ((clubData.sociosCRM || []).some(s => s.telemovel.replace(/\D/g, '') === dig)) return showBoToast('Já existe um sócio com este telemóvel.');
            let num;
            mutate(d => {
                const max = d.sociosCRM.reduce((m, s) => Math.max(m, parseInt(String(s.id).replace(/\D/g, ''), 10) || 0), 0);
                num = 'CFC-' + pad(max + 1, 3);
                d.sociosCRM.push({ id: num, nome, categoria, quotas: 'Em dia', telemovel });
            });
            logAudit(`Registou novo sócio ${num} (${nome})`);
            showBoToast(`Sócio ${num} registado!`);
            selectBoTab('socios');
        }

        function toggleQuota(id) {
            let novo = '';
            mutate(d => { const s = d.sociosCRM.find(x => x.id === id); if (s) { s.quotas = s.quotas === 'Em dia' ? 'Pendente' : 'Em dia'; novo = s.quotas; } });
            logAudit(`Atualizou quotas do sócio ${id} para "${novo}"`);
            selectBoTab('socios');
        }

        function changeSocioCat(id, cat) {
            mutate(d => { const s = d.sociosCRM.find(x => x.id === id); if (s) s.categoria = cat; });
            logAudit(`Alterou a categoria do sócio ${id} para "${cat}"`);
            showBoToast('Categoria atualizada.');
            socRenderTable();
        }

        async function removeSocio(id) {
            const s = clubData.sociosCRM.find(x => x.id === id);
            if (!s) return;
            const ok = await uiConfirm('Remover sócio', `Remover ${s.nome} (${s.id})? O histórico de vendas já registado é mantido.`, { danger: true, okText: 'Remover' });
            if (!ok) return;
            mutate(d => { d.sociosCRM = d.sociosCRM.filter(x => x.id !== id); });
            logAudit(`Removeu o sócio ${id} (${s.nome})`);
            selectBoTab('socios');
        }

        function saveDescontos(e) {
            e.preventDefault();
            const vals = {};
            for (let i = 0; i < SOCIO_CATEGORIAS.length; i++) {
                const v = Number($('desc-' + i).value);
                if (!(v >= 0 && v <= 100)) return showBoToast('Os descontos têm de estar entre 0 e 100%.');
                vals[SOCIO_CATEGORIAS[i]] = v;
            }
            const bloq = $('desc-bloq').checked;
            mutate(d => { d.descontos = vals; d.config.bloquearDescontoQuotasPendentes = bloq; });
            logAudit(`Alterou descontos de sócio: ${SOCIO_CATEGORIAS.map(c => c + ' ' + vals[c] + '%').join(', ')}; bloquear com quotas pendentes: ${bloq ? 'sim' : 'não'}`);
            showBoToast('Descontos guardados!');
            selectBoTab('socios');
        }

        function verComprasSocio(id) {
            const s = clubData.sociosCRM.find(x => x.id === id);
            const vs = (clubData.vendas || []).filter(v => v.socioId === id);
            $('socio-hist').innerHTML = `
                <div class="bg-white rounded-2xl shadow overflow-x-auto fade-in">
                    <h3 class="p-4 font-bold text-sm uppercase text-cfcDarkBlue border-b">Compras de ${esc(s ? s.nome : id)} (${esc(id)})</h3>
                    ${salesTableHTML(vs, 'Este sócio ainda não fez compras na loja.')}
                </div>`;
            $('socio-hist').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function exportSocios() {
            const aoa = [['Nº Sócio', 'Nome', 'Categoria', 'Desconto (%)', 'Telemóvel', 'Quotas', 'Nº Compras', 'Total Gasto (Kz)', 'Desconto Obtido (Kz)']];
            (clubData.sociosCRM || []).forEach(s => {
                const st = socioStats(s.id);
                aoa.push([s.id, s.nome, s.categoria, Number(clubData.descontos[s.categoria]) || 0, s.telemovel, s.quotas, st.n, st.total, st.desc]);
            });
            const fmt = saveWorkbook('CFC_Socios_' + todayISO(), [{ name: 'Sócios', aoa, widths: [11, 28, 22, 13, 18, 10, 12, 16, 18], money: [7, 8] }]);
            logAudit('Exportou a lista de sócios (' + fmt.toUpperCase() + ')');
            showBoToast(fmt === 'xlsx' ? 'Ficheiro Excel gerado!' : 'Gerado CSV (abre no Excel).');
        }

        // ======================================================================
        // 3. LOJA & VENDAS (PDV)
        // ======================================================================
        let pos = null;
        function newPos() { return { tipo: 'nao-socio', socioId: '', cart: [], nome: '', tel: '', pag: PAGAMENTOS[0] }; }

        function renderBoLoja(box) {
            pos = newPos();
            box.innerHTML = `
                <div class="fade-in space-y-6">
                    <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-cfcAccent">
                        <h2 class="font-display text-2xl font-bold text-cfcDarkBlue uppercase">Loja Oficial & Bilhetes (Ponto de Venda)</h2>
                        <p class="text-xs text-slate-500">Cada venda fica registada automaticamente em Finanças, identificando se foi de sócio (com desconto) ou não sócio. Próximo jogo: <strong>${esc(clubData.config.proximoJogo)}</strong></p>
                    </div>

                    <div id="pos-done"></div>

                    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                        <div class="lg:col-span-3 space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow space-y-4">
                                <h3 class="font-bold text-sm uppercase text-cfcDarkBlue">1. Cliente</h3>
                                <div class="grid grid-cols-2 gap-2 text-xs">
                                    <button id="pos-t-nao" onclick="posSetTipo('nao-socio')" class="px-3 py-3 rounded-lg font-bold border">Não sócio<span class="block font-normal text-[10px]">preço normal</span></button>
                                    <button id="pos-t-soc" onclick="posSetTipo('socio')" class="px-3 py-3 rounded-lg font-bold border">Sócio<span class="block font-normal text-[10px]">com desconto</span></button>
                                </div>
                                <div id="pos-customer"></div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow space-y-4">
                                <h3 class="font-bold text-sm uppercase text-cfcDarkBlue">2. Artigos</h3>
                                <div id="pos-products" class="space-y-4"></div>
                            </div>
                        </div>
                        <div class="lg:col-span-2">
                            <div class="bg-white p-6 rounded-2xl shadow space-y-4 lg:sticky lg:top-0">
                                <h3 class="font-bold text-sm uppercase text-cfcDarkBlue">3. Carrinho & Pagamento</h3>
                                <div id="pos-cart"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow overflow-x-auto">
                        <h3 class="p-4 font-bold text-sm uppercase text-cfcDarkBlue border-b">Últimas Vendas</h3>
                        <div id="pos-recent"></div>
                    </div>

                    <details class="bg-white rounded-2xl shadow">
                        <summary class="p-4 font-bold text-sm uppercase text-cfcDarkBlue cursor-pointer">Preços & Stock dos Artigos</summary>
                        <div class="p-4 pt-0 text-xs overflow-x-auto">
                            <table class="w-full text-left">
                                <thead class="uppercase text-slate-500"><tr><th class="py-2">Artigo</th><th>Categoria</th><th>Preço (Kz)</th><th>Stock / Vagas</th><th></th></tr></thead>
                                <tbody class="divide-y">
                                    ${clubData.catalogo.map(p => `
                                        <tr>
                                            <td class="py-2 font-semibold">${esc(p.nome)}</td><td>${esc(p.cat)}</td>
                                            <td><input type="number" min="0" id="cat-preco-${esc(p.id)}" value="${p.preco}" class="border rounded px-2 py-1 w-28"></td>
                                            <td>${p.bancada ? `${disponivel(clubData, p)} vagas` : `<input type="number" min="0" id="cat-stock-${esc(p.id)}" value="${p.stock}" class="border rounded px-2 py-1 w-24">`}</td>
                                            <td><button onclick="saveCatalogItem('${esc(p.id)}')" class="text-cfcBlue font-bold hover:underline">Guardar</button></td>
                                        </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </details>
                </div>
            `;
            posRenderCustomer(); posRenderProducts(); posRenderCart(); posRenderRecent();
        }

        function saveCatalogItem(id) {
            const preco = Number($('cat-preco-' + id).value);
            const stockEl = $('cat-stock-' + id);
            if (!(preco >= 0)) return showBoToast('Preço inválido.');
            mutate(d => {
                const p = d.catalogo.find(x => x.id === id);
                p.preco = Math.round(preco);
                if (stockEl) p.stock = Math.max(0, Math.round(Number(stockEl.value) || 0));
            });
            logAudit(`Atualizou preço/stock do artigo ${id} (${kz(preco)})`);
            showBoToast('Artigo atualizado.');
            posRenderProducts(); posRenderCart();
        }

        function posSetTipo(t) {
            pos.tipo = t;
            if (t === 'nao-socio') pos.socioId = '';
            posRenderCustomer(); posRenderProducts(); posRenderCart();
        }

        function posRenderCustomer() {
            $('pos-t-nao').className = 'px-3 py-3 rounded-lg font-bold border ' + (pos.tipo === 'nao-socio' ? 'bg-cfcBlue text-white border-cfcBlue' : 'bg-white text-slate-600 hover:border-cfcBlue');
            $('pos-t-soc').className = 'px-3 py-3 rounded-lg font-bold border ' + (pos.tipo === 'socio' ? 'bg-cfcBlue text-white border-cfcBlue' : 'bg-white text-slate-600 hover:border-cfcBlue');
            const box = $('pos-customer');
            if (pos.tipo === 'socio') {
                const cur = clubData.sociosCRM.find(s => s.id === pos.socioId);
                box.innerHTML = `
                    <input type="text" list="pos-socios-list" id="pos-socio-in" value="${cur ? esc(cur.id + ' — ' + cur.nome) : ''}" oninput="posSocioInput(this.value)" placeholder="Escreva o nº ou nome do sócio..." class="w-full border rounded-lg px-3 py-2.5 text-xs">
                    <datalist id="pos-socios-list">${clubData.sociosCRM.map(s => `<option value="${esc(s.id + ' — ' + s.nome)}"></option>`).join('')}</datalist>
                    <div id="pos-socio-status" class="mt-3"></div>`;
                posRenderSocioStatus();
            } else {
                box.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                        <input type="text" value="${esc(pos.nome)}" oninput="pos.nome=this.value" placeholder="Nome do cliente (opcional)" class="border rounded-lg px-3 py-2.5">
                        <input type="tel" value="${esc(pos.tel)}" oninput="pos.tel=this.value" placeholder="Telemóvel (opcional)" class="border rounded-lg px-3 py-2.5">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-2">Cliente não sócio: paga o preço normal, sem desconto.</p>`;
            }
        }

        function posSocioInput(v) {
            const t = v.trim().toLowerCase();
            const m = clubData.sociosCRM.find(s => t.startsWith(s.id.toLowerCase()) || t === s.nome.toLowerCase());
            pos.socioId = m ? m.id : '';
            posRenderSocioStatus(); posRenderProducts(); posRenderCart();
        }

        function posRenderSocioStatus() {
            const el = $('pos-socio-status');
            if (!el) return;
            const pr = priceCart(clubData, 'socio', pos.socioId, []);
            if (!pr.socio) { el.innerHTML = '<p class="text-xs text-slate-400"><i class="fas fa-search mr-1"></i> Selecione um sócio da lista para aplicar o desconto.</p>'; return; }
            el.innerHTML = `
                <div class="p-3 rounded-xl border text-xs ${pr.pct > 0 ? 'bg-green-50 border-green-200' : 'bg-amber-50 border-amber-200'}">
                    <p class="font-bold text-slate-800">${esc(pr.socio.nome)} <span class="text-slate-400 font-normal">(${esc(pr.socio.id)})</span></p>
                    <p class="text-slate-600">${esc(pr.socio.categoria)} • Quotas: <strong>${esc(pr.socio.quotas)}</strong></p>
                    <p class="mt-1 font-bold ${pr.pct > 0 ? 'text-green-700' : 'text-amber-700'}">${pr.pct > 0 ? `Desconto de ${pr.pct}% aplicado a todos os artigos` : `Sem desconto: ${esc(pr.motivo || 'categoria sem desconto definido')}`}</p>
                </div>`;
        }

        function posRenderProducts() {
            const pr = priceCart(clubData, pos.tipo, pos.socioId, []);
            const cats = [...new Set(clubData.catalogo.map(p => p.cat))];
            $('pos-products').innerHTML = cats.map(cat => `
                <div>
                    <p class="text-[11px] font-bold uppercase text-slate-400 mb-2">${esc(cat)}</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${clubData.catalogo.filter(p => p.cat === cat).map(p => {
                            const disp = disponivel(clubData, p);
                            const precoSocio = Math.round(p.preco * (1 - pr.pct / 100));
                            return `
                            <button onclick="posAdd('${esc(p.id)}')" ${disp <= 0 ? 'disabled' : ''} class="text-left p-3 rounded-xl border text-xs transition ${disp <= 0 ? 'opacity-40 cursor-not-allowed' : 'hover:border-cfcBlue hover:bg-cfcLightBlue/40'}">
                                <span class="block font-bold text-cfcDarkBlue">${esc(p.nome)}</span>
                                <span class="block mt-0.5">${pr.pct > 0 ? `<s class="text-slate-400">${kz(p.preco)}</s> <strong class="text-green-700">${kz(precoSocio)}</strong>` : `<strong>${kz(p.preco)}</strong>`}</span>
                                <span class="block text-[10px] ${disp <= 10 ? 'text-red-600 font-bold' : 'text-slate-500'}">${p.bancada ? 'Vagas' : 'Stock'}: ${disp}${disp <= 0 ? ' (esgotado)' : ''}</span>
                            </button>`;
                        }).join('')}
                    </div>
                </div>`).join('');
        }

        function posAdd(id) {
            const p = clubData.catalogo.find(x => x.id === id);
            const l = pos.cart.find(c => c.id === id);
            if (l) { if (l.qtd + 1 > disponivel(clubData, p)) return showBoToast('Sem mais disponibilidade deste artigo.'); l.qtd++; }
            else pos.cart.push({ id, qtd: 1 });
            posRenderCart();
        }
        function posQty(id, delta) {
            const l = pos.cart.find(c => c.id === id); if (!l) return;
            l.qtd += delta;
            if (l.qtd < 1) pos.cart = pos.cart.filter(c => c.id !== id);
            posRenderCart();
        }
        function posRemove(id) { pos.cart = pos.cart.filter(c => c.id !== id); posRenderCart(); }

        function posRenderCart() {
            const pr = priceCart(clubData, pos.tipo, pos.socioId, pos.cart);
            const pronto = pr.lines.length && !pr.erros.length && (pos.tipo !== 'socio' || pr.socio);
            $('pos-cart').innerHTML = `
                ${pr.lines.length ? `
                <div class="divide-y text-xs">
                    ${pr.lines.map(l => `
                        <div class="py-2.5 flex items-center justify-between gap-2">
                            <div class="min-w-0">

                            <div class="flex items-center space-x-1 flex-shrink-0">

                    <i class="fas fa-check-circle mr-2"></i> Finalizar Venda
                </button>
                ${pos.tipo === 'socio' && !pr.socio ? '<p class="text-[11px] text-amber-700">Selecione o sócio para finalizar.</p>' : ''}
                ` : '<p class="text-xs text-slate-400 text-center py-6"><i class="fas fa-shopping-cart text-2xl block mb-2"></i> Carrinho vazio. Toque num artigo para o adicionar.</p>'}
            `;

        function posFinalizar() {
            let sale;
            try {
                sale = mutate(d => applySale(d, { tipo: pos.tipo, socioId: pos.socioId, cart: pos.cart, nome: pos.nome.trim(), tel: pos.tel.trim(), pag: pos.pag }));

                clubData = loadClubData();
                posRenderProducts(); posRenderCart();
                return showBoToast(err.message, 'warn');

            logAudit(`Registou venda ${sale.id} (${sale.tipoCliente}${sale.descontoPct ? ' com ' + sale.descontoPct + '% desc.' : ''}) — ${kz(sale.total)}`);

                    <div class="text-xs">
                        <p class="font-bold text-green-800 text-sm"><i class="fas fa-check-circle mr-1"></i> Venda ${esc(sale.id)} registada — ${kz(sale.total)}</p>
                        <p class="text-green-700">${esc(tipoLabel(sale))}${sale.desconto ? ` • desconto de ${kz(sale.desconto)}` : ''} • já disponível em Finanças.</p>

                        <button onclick="printRecibo('${esc(sale.id)}')" class="bg-white border border-green-300 text-green-700 hover:bg-green-100 font-bold rounded-lg px-4 py-2 text-xs"><i class="fas fa-print mr-1"></i> Recibo</button>
                        <button onclick="exportVendas([findVenda('${esc(sale.id)}')], 'CFC_Venda_${esc(sale.id)}', 'Venda ${esc(sale.id)}')" class="bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg px-4 py-2 text-xs"><i class="fas fa-file-excel mr-1"></i> Excel</button>
                    </div>
                </div>`;

            $('pos-recent').innerHTML = salesTableHTML((clubData.vendas || []).slice(0, 8), 'Ainda não há vendas registadas.');
        }

        // ======================================================================
        // 4. FINANÇAS & RECEITAS
        // ======================================================================
        let fin = { de: '', ate: '', tipo: 'todos', q: '' };

        function finFiltered() {
            return (clubData.vendas || []).filter(v =>
                (!fin.de || v.data >= fin.de) && (!fin.ate || v.data <= fin.ate) &&
                (fin.tipo === 'todos' || (fin.tipo === 'socio' && v.tipoCliente === 'Sócio') || (fin.tipo === 'nao-socio' && v.tipoCliente !== 'Sócio')) &&

                            <div class="bg-white p-5 rounded-xl shadow"><span class="text-xs text-slate-400 font-bold uppercase">Contratos Patrocínio</span><p class="font-display text-2xl font-bold text-cfcDarkBlue mt-1">25.000.000 Kz</p></div>

                        </div>

                    <div id="fin-results" class="space-y-6"></div>
                </div>
            `;

        function finRange(kind) {
            const now = new Date(); let de = '', ate = '';
            if (kind === 'hoje') { de = ate = todayISO(); }
            else if (kind === 'semana') { const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); de = isoOf(d); ate = todayISO(); }
            else if (kind === 'mes') { de = isoOf(new Date(now.getFullYear(), now.getMonth(), 1)); ate = todayISO(); }
            $('fin-de').value = de; $('fin-ate').value = ate;
            finApply();
        }
        function finApply() {
            fin.de = $('fin-de').value;
            fin.ate = $('fin-ate').value;
            fin.tipo = $('fin-tipo').value;
            fin.q = $('fin-q').value.trim().toLowerCase();
            finRender();
        }
        function finExport() { exportVendas(finFiltered(), 'CFC_Vendas_Loja_' + todayISO(), finPeriodo()); }

        function finRender() {
            const all = finFiltered();
            const ok = all.filter(v => v.estado !== 'Anulada');
            const agg = list => ({ n: list.length, total: list.reduce((s, v) => s + v.total, 0), desc: list.reduce((s, v) => s + v.desconto, 0) });
            const socCom = agg(ok.filter(v => v.tipoCliente === 'Sócio' && v.descontoPct > 0));
            const socSem = agg(ok.filter(v => v.tipoCliente === 'Sócio' && !(v.descontoPct > 0)));
            const nao = agg(ok.filter(v => v.tipoCliente !== 'Sócio'));
            const tot = agg(ok);
            const porCat = {};
            ok.forEach(v => v.itens.forEach(it => { const c = porCat[it.categoria] = porCat[it.categoria] || { qtd: 0, total: 0 }; c.qtd += it.qtd; c.total += it.total; }));
            $('fin-results').innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-xl shadow border-l-4 border-cfcBlue"><span class="text-xs text-slate-400 font-bold uppercase">Total Líquido</span><p class="font-display text-2xl font-bold text-slate-800 mt-1">${kz(tot.total)}</p><p class="text-[11px] text-slate-500">${tot.n} venda(s)</p></div>
                    <div class="bg-white p-5 rounded-xl shadow border-l-4 border-green-500"><span class="text-xs text-slate-400 font-bold uppercase">Sócios (com desconto)</span><p class="font-display text-2xl font-bold text-green-700 mt-1">${kz(socCom.total)}</p><p class="text-[11px] text-slate-500">${socCom.n} venda(s) • desconto dado: ${kz(socCom.desc)}</p></div>
                    <div class="bg-white p-5 rounded-xl shadow border-l-4 border-slate-400"><span class="text-xs text-slate-400 font-bold uppercase">Não sócios (preço normal)</span><p class="font-display text-2xl font-bold text-slate-700 mt-1">${kz(nao.total)}</p><p class="text-[11px] text-slate-500">${nao.n} venda(s)</p></div>
                    <div class="bg-white p-5 rounded-xl shadow border-l-4 border-amber-400"><span class="text-xs text-slate-400 font-bold uppercase">Sócios sem desconto</span><p class="font-display text-2xl font-bold text-amber-700 mt-1">${kz(socSem.total)}</p><p class="text-[11px] text-slate-500">${socSem.n} venda(s) (quotas pendentes)</p></div>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow text-xs">
                    <p class="font-bold uppercase text-slate-500 mb-2">Por categoria de artigo</p>
                    <div class="flex flex-wrap gap-2">${Object.keys(porCat).map(k => `<span class="bg-cfcLightBlue text-cfcDarkBlue font-bold px-3 py-1.5 rounded-lg">${esc(k)}: ${porCat[k].qtd} un. • ${kz(porCat[k].total)}</span>`).join('') || '<span class="text-slate-400">Sem vendas no período.</span>'}</div>
                </div>
                <div class="bg-white rounded-2xl shadow overflow-x-auto">${salesTableHTML(all, 'Sem vendas para os filtros escolhidos.')}</div>
            `;

        function backupDownload() {
            let audit = [];
            try { audit = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]'); } catch (e) {}
            const pack = { app: 'CFC Back-Office', versao: 3, exportadoEm: new Date().toISOString(), dados: loadClubData(), utilizadores: usersList, auditoria: audit };
            downloadBlob('CFC_Backup_' + todayISO() + '.json', new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }));
            logAudit('Fez uma cópia de segurança');
            showBoToast('Cópia de segurança descarregada. Guarde-a num local seguro.');
        }

        async function backupRestore(input) {
            const f = input.files && input.files[0];
            if (!f) return;
            const text = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(''); r.readAsText(f); });
            let pack = null;
            try { pack = JSON.parse(text); } catch (e) {}
            if (!pack || !pack.dados || !Array.isArray(pack.dados.sociosCRM)) { input.value = ''; return showBoToast('Este ficheiro não é uma cópia de segurança válida.'); }
            const ok = await uiConfirm('Restaurar cópia', `Vai substituir TODOS os dados atuais pelos da cópia de ${pack.exportadoEm ? pack.exportadoEm.slice(0, 10) : 'data desconhecida'}. Continuar?`, { danger: true, okText: 'Restaurar' });
            input.value = '';
            if (!ok) return;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(pack.dados));
            if (Array.isArray(pack.utilizadores) && pack.utilizadores.some(u => u.isAdmin)) {
                localStorage.setItem(USERS_KEY, JSON.stringify(pack.utilizadores));
                usersList = loadUsers();
                currentUser = usersList.find(u => u.id === currentUser.id && u.ativo) || usersList.find(u => u.isAdmin);
            }
            if (Array.isArray(pack.auditoria)) localStorage.setItem(AUDIT_KEY, JSON.stringify(pack.auditoria));
            logAudit('Restaurou uma cópia de segurança');
            showBoToast('Cópia restaurada com sucesso!');
            selectBoTab('definicoes');
        }

        async function resetDemo() {
            const t = await uiPrompt('Repor dados', 'Isto apaga vendas, sócios, notícias, multimédia e mensagens, que também são lidos pelo site. Escreva APAGAR para confirmar.', { placeholder: 'APAGAR', okText: 'Repor dados' });
            if (t === null) return;
            if (t.trim().toUpperCase() !== 'APAGAR') return showBoToast('Escreva APAGAR para confirmar.');
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(AUDIT_KEY);
            clubData = loadClubData();
            logAudit('Repôs os dados de demonstração');
            showBoToast('Dados repostos.');
            selectBoTab('definicoes');
        }

        function exportAudit() {
            let logs = [];
            try { logs = JSON.parse(localStorage.getItem(AUDIT_KEY) || '[]'); } catch (e) {}
            const aoa = [['Data', 'Utilizador', 'Ação'], ...logs.map(l => [l.data, l.usuario, l.acao])];
            const fmt = saveWorkbook('CFC_Auditoria_' + todayISO(), [{ name: 'Auditoria', aoa, widths: [20, 28, 90] }]);
            showBoToast(fmt === 'xlsx' ? 'Ficheiro Excel gerado!' : 'Gerado CSV (abre no Excel).');
        }

        // ======================================================================
        // ARRANQUE, ATALHOS, GESTOS E INATIVIDADE
        // ======================================================================
        let lastAct = Date.now();
        ['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
        setInterval(() => {
            if (currentUser && Date.now() - lastAct > IDLE_MS) logoutBackoffice('Sessão terminada por inatividade (' + (IDLE_MS / 60000) + ' min). Entre novamente.');
        }, 30000);

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k') {
                e.preventDefault();
                if (currentUser) { if ($('palette-bg')) closePalette(); else openPalette(); }
                return;
            }
            if (e.key === 'Escape') {
                if ($('modal-bg')) closeModal();
                else if ($('palette-bg')) closePalette();
                else if (currentUser && !isDesktop() && menuOpen) setMenu(false);
                return;
            }
            const tag = document.activeElement ? document.activeElement.tagName : '';
            if (e.key === '/' && currentUser && !/INPUT|TEXTAREA|SELECT/.test(tag) && !$('modal-bg')) { e.preventDefault(); openPalette(); }
        });

        // Deslizar: do bordo esquerdo para a direita abre o menu; para a esquerda fecha (telemóvel)
        let _tx = 0, _ty = 0;
        document.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', e => {
            if (!currentUser || isDesktop()) return;
            const dx = e.changedTouches[0].clientX - _tx, dy = e.changedTouches[0].clientY - _ty;
            if (Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
            if (!menuOpen && _tx < 28 && dx > 0) setMenu(true);
            else if (menuOpen && dx < 0) setMenu(false);
        }, { passive: true });

        let _wasDesktop = null;
        window.addEventListener('resize', () => {
            const d = isDesktop();
            if (_wasDesktop !== null && d !== _wasDesktop && currentUser) applyMenuForViewport();
            _wasDesktop = d;
        });

        window.onload = () => {
            _wasDesktop = isDesktop();
            if (PUBLIC_SITE_URL) {
                ['public-site-link-login', 'public-site-link-nav'].forEach(id => {
                    const a = $(id);
                    a.href = PUBLIC_SITE_URL; a.classList.remove('hidden');
                });
            }
            if (DEMO_MODE) {
                $('demo-box').classList.remove('hidden');
                $('bo-login-user').value = 'admin@carlosfc.ao';
                $('bo-login-pass').value = 'admin123';
            }
            renderQuickLogins();
            try {
                const sid = sessionStorage.getItem(SESSION_KEY);
                const u = sid && usersList.find(x => x.id === sid && x.ativo);
                if (u) { currentUser = u; enterDashboard(true); }
            } catch (e) {}
        };
    </script>
</body>
</html>
